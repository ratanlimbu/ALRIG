name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structural lint
        run: node tests/lint.mjs
      - name: Validate manifests
        # Pinned: an unpinned CLI turns CI red on an upstream release with no change here.
        # Raise it deliberately, in its own commit.
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.325
          claude plugin validate .
          claude plugin validate ./plugins/alrig
      - name: Plugin and skill versions agree
        run: |
          want=$(node -p "require('./plugins/alrig/.claude-plugin/plugin.json').version")
          bad=$(grep -L "^version: $want$" plugins/alrig/skills/*/SKILL.md || true)
          if [ -n "$bad" ]; then echo "skills not at $want:"; echo "$bad"; exit 1; fi
          echo "all at $want"

  # Executes the write-guard hook and every PowerShell script against known inputs
  # (tests/scripts.test.ps1). Two legs, because the scripts promise both runtimes:
  #  - Linux, PowerShell 7, with gitleaks, so the shipped gitleaks-al.toml is parsed and used;
  #  - Windows PowerShell 5.1, without gitleaks, so the built-in fallback is what runs.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
            gitleaks: true
          - os: windows-latest
            shell: powershell
            gitleaks: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        if: matrix.gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Script tests
        run: ./tests/scripts.test.ps1
